<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Razi — AI, Python and Robotics"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#14123a"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0; 0.6 0; -0.6 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="930" cy="160" r="260" fill="url(#glow)">
      <animate attributeName="r" values="230;280;230" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- neural network -->
    <g stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.35" fill="none">
      <g>
        <path d="M740 70 L860 40 M740 70 L860 120 M740 70 L860 200 M740 160 L860 40 M740 160 L860 120 M740 160 L860 200 M740 160 L860 280 M740 250 L860 120 M740 250 L860 200 M740 250 L860 280"/>
        <path d="M860 40 L980 80 M860 40 L980 170 M860 120 L980 80 M860 120 L980 170 M860 120 L980 260 M860 200 L980 80 M860 200 L980 170 M860 200 L980 260 M860 280 L980 170 M860 280 L980 260"/>
        <path d="M980 80 L1100 120 M980 80 L1100 210 M980 170 L1100 120 M980 170 L1100 210 M980 260 L1100 120 M980 260 L1100 210"/>
      </g>
      <path d="M740 160 L860 120 L980 170 L1100 120" stroke="#f0abfc" stroke-width="2.2" stroke-opacity="0.9" stroke-dasharray="14 12">
        <animate attributeName="stroke-dashoffset" values="0;-104" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M740 250 L860 200 L980 80 L1100 210" stroke="#67e8f9" stroke-width="2.2" stroke-opacity="0.9" stroke-dasharray="14 12">
        <animate attributeName="stroke-dashoffset" values="0;-104" dur="3.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <g fill="#0b1020" stroke="#67e8f9" stroke-width="2">
      <circle cx="740" cy="70" r="9"><animate attributeName="fill" values="#0b1020;#67e8f9;#0b1020" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="160" r="9"><animate attributeName="fill" values="#0b1020;#67e8f9;#0b1020" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="250" r="9"><animate attributeName="fill" values="#0b1020;#67e8f9;#0b1020" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="40" r="9"><animate attributeName="fill" values="#0b1020;#a78bfa;#0b1020" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="120" r="9"><animate attributeName="fill" values="#0b1020;#a78bfa;#0b1020" dur="3s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="200" r="9"><animate attributeName="fill" values="#0b1020;#a78bfa;#0b1020" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="280" r="9"><animate attributeName="fill" values="#0b1020;#a78bfa;#0b1020" dur="3s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="80" r="9"><animate attributeName="fill" values="#0b1020;#f0abfc;#0b1020" dur="3s" begin="2.0s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="170" r="9"><animate attributeName="fill" values="#0b1020;#f0abfc;#0b1020" dur="3s" begin="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="260" r="9"><animate attributeName="fill" values="#0b1020;#f0abfc;#0b1020" dur="3s" begin="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="120" r="9"><animate attributeName="fill" values="#0b1020;#67e8f9;#0b1020" dur="3s" begin="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="210" r="9"><animate attributeName="fill" values="#0b1020;#67e8f9;#0b1020" dur="3s" begin="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- scan line -->
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;320" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- text -->
    <text x="60" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="url(#title)">Hi, I'm Razi</text>
    <text x="62" y="190" font-family="'Courier New', monospace" font-size="26" fill="#cbd5e1">AI  •  Python  •  Robotics  •  Web</text>
    <text x="62" y="236" font-family="'Courier New', monospace" font-size="20" fill="#67e8f9">
      &gt; building small things that learn
      <animate attributeName="opacity" values="1;1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
